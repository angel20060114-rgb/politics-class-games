<!doctype html><html lang="zh"><meta charset="utf-8"><title>市场局限分类PK</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f0f5fb;color:#17314d;margin:0}.wrap{max-width:900px;margin:40px auto;background:white;border-radius:18px;padding:35px;box-shadow:0 10px 40px #ccd8e8}h1{color:#174f85}button{padding:12px 20px;border:0;border-radius:10px;background:#176bb2;color:white;cursor:pointer;margin:7px;font-size:16px}.card{background:#eef6ff;padding:18px;border-radius:12px;margin:14px 0}.choices button{display:block;text-align:left;width:90%;background:#e2eef9;color:#153959}.choices button:hover{background:#bddbf5}.feedback{font-size:20px;font-weight:bold;color:#126b43}.tag{color:#607c99}</style><div class="wrap"><div class="tag">高中思想政治 · 互动方式二 · 分组PK</div><h1>⚡ 市场调节辨析PK</h1><p>两组轮流作答。阅读案例，点击对应的市场调节局限性；系统自动累计得分。</p><div class="card"><h2 id="team"></h2><h3 id="case"></h3><div class="choices" id="opts"></div><p class="feedback" id="feed"></p><button id="next" onclick="next()" style="display:none">下一题 →</button></div><p id="scores"></p></div><script>const cases=[['商家为追求利润隐瞒食品质量问题',0],['农户看到别人种草莓赚钱，缺乏充分信息便跟风扩种',1],['草莓种下后需要时间生长，发现滞销时已难及时调整',2],['经营者为牟利销售不合格产品',0],['企业仅凭局部价格信号，未掌握整体市场信息而盲目投资',1],['供需变化已发生，但生产规模调整需要较长时间',2]];const names=['自发性','盲目性','滞后性'];let idx=0,points=[0,0];function render(){document.getElementById('team').textContent=`第 ${idx+1} 题 · ${idx%2?'B':'A'}组作答`;document.getElementById('case').textContent=cases[idx][0];document.getElementById('opts').innerHTML=names.map((n,j)=>`<button onclick="pick(${j})">${n}</button>`).join('');document.getElementById('feed').textContent='';document.getElementById('next').style.display='none';document.getElementById('scores').textContent=`A组 ${points[0]} 分 ｜ B组 ${points[1]} 分`;}function pick(j){let right=cases[idx][1],ok=j===right;if(ok)points[idx%2]++;document.getElementById('feed').textContent=(ok?'✓ 正确！':'✗ 再辨析。')+'本题对应：'+names[right];document.getElementById('opts').innerHTML='';document.getElementById('next').style.display='inline-block';document.getElementById('scores').textContent=`A组 ${points[0]} 分 ｜ B组 ${points[1]} 分`;}function next(){idx++;if(idx<cases.length)render();else{document.querySelector('.card').innerHTML=`<h2>PK结束</h2><p>A组 ${points[0]} 分；B组 ${points[1]} 分。</p><p>请各组解释最容易混淆的一题，并评价“市场万能论”。</p><button onclick="location.reload()">再来一轮</button>`;}}render();</script></html>
