<!doctype html><html lang="zh"><meta charset="utf-8"><title>市场机制闯关游戏</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f0f5fb;color:#17314d;margin:0}.wrap{max-width:900px;margin:40px auto;background:white;border-radius:18px;padding:35px;box-shadow:0 10px 40px #ccd8e8}h1{color:#174f85}button{padding:12px 20px;border:0;border-radius:10px;background:#176bb2;color:white;cursor:pointer;margin:7px;font-size:16px}.card{background:#eef6ff;padding:18px;border-radius:12px;margin:14px 0}.choices button{display:block;text-align:left;width:90%;background:#e2eef9;color:#153959}.choices button:hover{background:#bddbf5}.feedback{font-size:20px;font-weight:bold;color:#126b43}.tag{color:#607c99}</style><div class="wrap"><div class="tag">高中思想政治 · 互动方式一 · 闯关游戏</div><h1>🍓 草莓市场大闯关</h1><p>依次闯过三关，理解市场如何配置资源。每关选对后进入下一关。</p><div class="card"><h2 id="level">第一关</h2><h3 id="question"></h3><div id="choices" class="choices"></div><p id="feedback" class="feedback"></p><button id="next" onclick="advance()" style="display:none">进入下一关 →</button></div><p id="progress"></p></div><script>const data=[['第一关：价格信号','草莓需求增加而供给暂时不变，价格通常可能怎样变化？',['上涨','一定不变','无限下降'],0,'需求增加可能推动价格上涨。'],['第二关：生产调整','草莓价格持续上涨，农户可能如何调整生产？',['减少全部投入','扩大种植规模','不考虑价格信息'],1,'价格信号可能引导生产要素流向草莓种植。'],['第三关：市场反馈','大量农户扩大种植后，草莓集中上市，价格可能怎样变化？',['因供给增加而回落','必然永久上涨','与供求完全无关'],0,'供给增加可能使价格回落，市场通过价格和供求调节资源配置。']];let i=0,score=0;function render(){let d=data[i];document.getElementById('level').textContent=d[0];document.getElementById('question').textContent=d[1];document.getElementById('choices').innerHTML=d[2].map((x,j)=>`<button onclick="answer(${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('');document.getElementById('feedback').textContent='';document.getElementById('next').style.display='none';document.getElementById('progress').textContent=`进度 ${i+1}/3 · 已通过 ${score} 关`;}function answer(j){let d=data[i];if(j===d[3]){score++;document.getElementById('feedback').textContent='✓ 回答正确！'+d[4];document.getElementById('next').style.display='inline-block';document.getElementById('choices').innerHTML='';}else document.getElementById('feedback').textContent='再想一想：价格与供求、生产决策有什么关系？';}function advance(){if(i<2){i++;render()}else{document.querySelector('.card').innerHTML='<h2>🎉 闯关成功！</h2><p>你已完成价格—供求—生产调整的机制探究。</p><button onclick="location.reload()">重新挑战</button>';document.getElementById('progress').textContent='完成 3/3 关';}}render();</script></html>
